<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Kota Bogor - Live Stream Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #333;
    }
    #map {
      height: 100vh;
      width: 100%;
      z-index: 1;
    }
    
    /* Search Bar Control */
    .search-box {
      position: absolute;
      top: 14px;
      left: 60px;
      z-index: 1000;
      background: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
      width: 320px;
      max-width: calc(100vw - 80px);
    }
    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      padding: 4px;
      background: transparent;
    }
    .search-box span {
      font-size: 16px;
      color: #777;
    }

    /* Video Panel */
    .cctv-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 360px;
      max-width: calc(100vw - 28px);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      padding: 14px;
      z-index: 1000;
      display: none;
      transition: all 0.2s ease-in-out;
    }
    .cctv-panel.active {
      display: block;
    }
    .cctv-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 10px;
    }
    .cctv-panel h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #b00020;
      line-height: 1.3;
    }
    .cctv-close {
      cursor: pointer;
      background: rgba(0, 0, 0, 0.05);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .cctv-close:hover {
      background: #b00020;
      color: #fff;
    }
    .cctv-player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .cctv-player-wrapper video,
    .cctv-player-wrapper iframe,
    .cctv-player-wrapper a {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .cctv-info {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cctv-info a {
      color: #b00020;
      text-decoration: none;
      font-weight: 600;
    }
    .cctv-info a:hover {
      text-decoration: underline;
    }

    /* Marker Dots */
    .cctv-marker-dot {
      background: #d32f2f;
      border: 2px solid #ffffff;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.4), 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.15s ease-in-out;
    }
    .cctv-marker-dot:hover {
      transform: scale(1.3);
      background: #ff1744;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Search Filter Overlay -->
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="Cari nama lokasi CCTV (mis. Tugu Kujang, Tajur)..." />
  </div>

  <!-- CCTV Video Panel -->
  <div id="cctv-panel" class="cctv-panel">
    <div class="cctv-panel-header">
      <h3 id="cctv-title"></h3>
      <button id="cctv-close-btn" class="cctv-close" title="Tutup">&times;</button>
    </div>
    <div id="cctv-player" class="cctv-player-wrapper"></div>
    <div class="cctv-info">
      <span id="cctv-hint"></span>
      <span id="cctv-link-wrapper"></span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.0/dist/hls.min.js"></script>
  <script src="cctv-data.js"></script>
  <script src="index.js"></script>
</body>
</html>
