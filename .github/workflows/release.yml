name: Build Smart Finder release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build desktop installer
        shell: pwsh
        run: |
          npm run desktop:build 2>&1 | Tee-Object electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log-${{ github.run_number }}
          path: electron-builder.log
          if-no-files-found: warn
      - name: Publish builder failure diagnostic
        if: failure()
        uses: actions/github-script@v7
        env:
          BUILDER_LOG: electron-builder.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.BUILDER_LOG)
              ? fs.readFileSync(process.env.BUILDER_LOG, 'utf8')
              : 'builder log tidak ditemukan';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build diagnostic run ${context.runNumber}`,
              body: `Diagnostic otomatis untuk run ${context.runNumber}.\\n\\n\\`\\`\\`text\\n${log.slice(-60000)}\\n\\`\\`\\``
            });
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.RELEASE_VERSION }}"
          name: "Smart Finder ${{ env.RELEASE_VERSION }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Smart-Finder-${{ env.RELEASE_VERSION }}-Setup-x64.exe
            dist/Smart-Finder-${{ env.RELEASE_VERSION }}-Setup-x64.exe.blockmap
            dist/Smart-Finder-${{ env.RELEASE_VERSION }}-Portable-x64.exe
            dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
