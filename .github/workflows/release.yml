name: Build Smart Finder release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle Python runtime for Instagram features
        shell: pwsh
        run: |
          $runtime = Join-Path $env:GITHUB_WORKSPACE "runtime\python"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $runtime -Force
          $pth = Get-ChildItem $runtime -Filter "*_pth" | Select-Object -First 1
          Add-Content -Path $pth.FullName -Value "Lib\site-packages"
          Add-Content -Path $pth.FullName -Value "import site"
          New-Item -ItemType Directory -Force -Path (Join-Path $runtime "Lib\site-packages") | Out-Null
          python -m pip install --disable-pip-version-check --no-cache-dir --target (Join-Path $runtime "Lib\site-packages") requests selenium
      - run: npm ci
      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build desktop installer
        shell: pwsh
        run: |
          npm run desktop:build 2>&1 | Tee-Object electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log-${{ github.run_number }}
          path: electron-builder.log
          if-no-files-found: warn
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.RELEASE_VERSION }}"
          name: "Smart Finder ${{ env.RELEASE_VERSION }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Smart-Finder-${{ env.RELEASE_VERSION }}-Setup-x64.exe
            dist/Smart-Finder-${{ env.RELEASE_VERSION }}-Setup-x64.exe.blockmap
            dist/Smart-Finder-${{ env.RELEASE_VERSION }}-Portable-x64.exe
            dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
