name: Build Smart Finder release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci 2>&1 | Tee-Object npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set release version
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build desktop installer
        shell: pwsh
        run: |
          npm run desktop:build 2>&1 | Tee-Object electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log-${{ github.run_number }}
          path: |
            npm-ci.log
            electron-builder.log
          if-no-files-found: warn
      - name: Publish builder failure diagnostic
        if: failure()
        uses: actions/github-script@v7
        env:
          BUILDER_LOG: electron-builder.log
        with:
          script: |
            const fs = require('fs');
            const logs = ['npm-ci.log', process.env.BUILDER_LOG]
              .filter((file) => fs.existsSync(file))
              .map((file) => `--- ${file} ---\n${fs.readFileSync(file, 'utf8')}`);
            const log = logs.join('\n\n') || 'log build tidak ditemukan';
            const body = [
              `Diagnostic otomatis untuk run ${context.runNumber}.`,
              '',
              '```text',
              log.slice(-60000),
              '```'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build diagnostic run ${context.runNumber}`,
              body
            });
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.RELEASE_VERSION }}"
          name: "Smart Finder ${{ env.RELEASE_VERSION }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Smart-Finder-${{ env.RELEASE_VERSION }}-Setup-x64.exe
            dist/Smart-Finder-${{ env.RELEASE_VERSION }}-Setup-x64.exe.blockmap
            dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
